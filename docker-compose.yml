services:
  postgres:
    image: postgres:16-alpine
    container_name: openbench_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbench_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openbench}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbench}"]
      interval: 10s
      timeout: 5s
      retries: 5


  inngest:
    image: inngest/inngest:latest
    container_name: openbench_inngest
    restart: unless-stopped
    # Removed --no-discovery so Inngest can reach the frontend to sync functions.
    # -u tells it exactly where to find the app on startup — no manual syncing needed.
    command: inngest dev --host 0.0.0.0 --port 8288 -u http://frontend:3000/api/inngest
    ports:
      - "8288:8288"
    environment:
      INNGEST_DEV: "1"
    depends_on:
      frontend:
        condition: service_started


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: openbench_backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"
      - "8001:8001"

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openbench}:${POSTGRES_PASSWORD:-openbench_secret}@postgres:5432/${POSTGRES_DB:-openbench}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}

      CORS_ORIGINS: '["http://localhost:3000"]'

    volumes:
      - ./backend:/app

    extra_hosts:
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: openbench_frontend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openbench}:${POSTGRES_PASSWORD:-openbench_secret}@postgres:5432/${POSTGRES_DB:-openbench}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-local}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-local}
      INNGEST_BASE_URL: http://inngest:8288
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      RUNNING_IN_DOCKER: "1"


volumes:
  postgres_data: