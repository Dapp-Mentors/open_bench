services:
  postgres:
    image: postgres:16-alpine
    container_name: openbench_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbench_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openbench}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbench}"]
      interval: 10s
      timeout: 5s
      retries: 5


  inngest:
    image: inngest/inngest:latest
    container_name: openbench_inngest
    restart: unless-stopped
    command: inngest dev --host 0.0.0.0 --port 8288 -u http://frontend:3000/api/inngest
    ports:
      - "8288:8288"
    environment:
      INNGEST_DEV: "1"
    depends_on:
      frontend:
        condition: service_started


  ollama:
    image: ollama/ollama:latest
    container_name: openbench_ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q . && exit 0 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


  ollama-setup:
    image: ollama/ollama:latest
    container_name: openbench_ollama_setup
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "
        echo '[OLLAMA-SETUP] Waiting for ollama service to be ready...' &&
        until ollama list 2>/dev/null; do
          sleep 2
        done &&
        echo '[OLLAMA-SETUP] Pulling embedding model: nomic-embed-text:latest' &&
        ollama pull nomic-embed-text:latest &&
        echo '[OLLAMA-SETUP] Model pulled successfully. Exiting.' &&
        exit 0
      "
    depends_on:
      ollama:
        condition: service_healthy


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: openbench_backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      ollama-setup:
        condition: service_completed_successfully

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openbench}:${POSTGRES_PASSWORD:-openbench_secret}@postgres:5432/${POSTGRES_DB:-openbench}

      OLLAMA_BASE_URL: http://ollama:11434

      # JSON array — pydantic-settings parses it natively
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}

      UPLOADS_DIR: /uploads

      # ── Sia Storage ──────────────────────────────────────
      SIA_APP_SERVICE_URL: ${SIA_APP_SERVICE_URL:-http://backend:8000}

    volumes:
      - ./backend:/app
      # Shared task ZIPs — frontend writes here after upload, backend reads for execution
      - task_uploads:/uploads
      # Docker socket — lets the backend spin up sibling task containers on the host daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent Sia app key & recovery phrase
      - sia_data:/app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: openbench_frontend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openbench}:${POSTGRES_PASSWORD:-openbench_secret}@postgres:5432/${POSTGRES_DB:-openbench}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-local}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-local}
      INNGEST_BASE_URL: http://inngest:8288
      BACKEND_URL: http://backend:8000
      AUTH_SECRET: lTtDZlfpNjrSIA2EocS7GEAaH3SHLsOr41X4udYY1k4=
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      RUNNING_IN_DOCKER: "1"

    volumes:
      # Same shared volume so the frontend can write ZIPs here after upload
      - task_uploads:/uploads


volumes:
  postgres_data:
  task_uploads:
  ollama_data:
  sia_data:
